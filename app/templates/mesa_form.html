{% extends "base.html" %}
{% block title %}{{ accion }} Mesa{% endblock %}
{% block page_title %}{{ accion }} Mesa Electoral{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Número de mesa</label>
                        <input type="number" name="numero_mesa" class="form-control" min="1"
                               value="{{ mesa.numero_mesa if mesa is defined and mesa else '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Ubicación</label>
                        <input type="text" name="ubicacion" class="form-control" placeholder="Ej: Salón A, Edificio 1"
                               value="{{ mesa.ubicacion if mesa is defined and mesa else '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Votación</label>
                        <select name="votacion_id" class="form-select" required>
                            <option value="">Seleccionar votación...</option>
                            {% for v in votaciones %}
                            <option value="{{ v.id }}" {% if mesa is defined and mesa and mesa.votacion_id == v.id %}selected{% endif %}>
                                {{ v.nombre }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Responsable</label>
                        <select name="responsable_id" class="form-select">
                            <option value="">Sin asignar</option>
                            {% for u in usuarios %}
                            <option value="{{ u.id }}" {% if mesa is defined and mesa and mesa.responsable_id == u.id %}selected{% endif %}>
                                {{ u.nombre }} ({{ u.rol }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> Guardar
                        </button>
                        <a href="{{ url_for('votaciones.listar') }}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
