{% extends "base.html" %}
{% block title %}Iniciar Sesión{% endblock %}

{% block content_full %}
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1a5276 0%, #0e3a54 100%);">
    <div style="background: white; border-radius: 12px; padding: 40px; width: 380px; box-shadow: 0 20px 40px rgba(0,0,0,0.2);">
        <div style="text-align: center; margin-bottom: 28px;">
            <div style="width: 50px; height: 50px; background: #1a5276; border-radius: 10px; margin: 0 auto 14px; display: flex; align-items: center; justify-content: center;">
                <i class="bi bi-check2-square" style="color: white; font-size: 24px;"></i>
            </div>
            <h2 style="font-size: 20px; font-weight: 600; color: #333; margin: 0;">Sistema de Votaciones</h2>
            <p style="font-size: 13px; color: #888; margin: 6px 0 0;">Ingresa tus credenciales</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="mb-3">
                <label class="form-label" style="font-size: 13px; font-weight: 500;">Correo electrónico</label>
                <input type="email" name="correo" class="form-control" placeholder="admin@votaciones.gt" required>
            </div>
            <div class="mb-3">
                <label class="form-label" style="font-size: 13px; font-weight: 500;">Contraseña</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100" style="background: #1a5276; border: none; padding: 10px;">
                Iniciar sesión
            </button>
        </form>

        <p style="text-align: center; font-size: 12px; color: #aaa; margin-top: 20px;">
            Usuario por defecto: admin@votaciones.gt / admin123
        </p>
    </div>
</div>
{% endblock %}
